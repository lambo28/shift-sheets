<div class="d-flex justify-content-between align-items-center mb-4 page-header-stack">
    <div>
        <h1>
            {% if page_header_icon %}<i class="{{ page_header_icon }}"></i> {% endif %}{{ page_header_title }}
        </h1>
        {% if page_header_subtitle %}
        <h4 class="text-muted">{{ page_header_subtitle }}</h4>
        {% endif %}
    </div>
    {% if page_header_actions_html %}
    <div class="page-header-actions">
        {{ page_header_actions_html|safe }}
    </div>
    {% endif %}
</div>
