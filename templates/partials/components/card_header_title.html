<div class="card-header{% if card_header_class %} {{ card_header_class }}{% endif %}">
    <h{{ card_title_level|default('5') }} class="mb-0">
        {% if card_icon %}<i class="{{ card_icon }}"></i> {% endif %}{{ card_title }}
    </h{{ card_title_level|default('5') }}>
    {% if card_subtitle %}
    <p class="mb-0 text-muted">{{ card_subtitle }}</p>
    {% endif %}
</div>
